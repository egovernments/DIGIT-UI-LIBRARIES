# DIGIT Accessibility Scanner — docker-compose for local & demo deployments.
#
# Single process, single port: the API serves both the JSON API (under
# ${BASE_PATH}/api/*) and the built UI static files (under ${BASE_PATH}/).
#
# Usage:
#   1. docker compose up --build
#   2. open http://localhost:3000/digit-a11y
#
# Auth is opt-in. With no API_KEY set the API runs without auth — fine for
# local development and public demos. To turn auth on, set API_KEY (e.g. in a
# .env file next to this compose file); the UI then needs the same key sent as
# the x-api-key header.
#
# BASE_PATH must match at build time and runtime (the UI bundle bakes it in),
# so it is passed both as a build arg and an env var below.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_PATH: ${BASE_PATH:-/digit-a11y}
    image: digit-a11y-agent:latest
    command: ["pnpm", "--filter", "@digit-a11y/api", "start"]
    environment:
      - NODE_ENV=production
      - API_HOST=0.0.0.0
      - API_PORT=3000
      - BASE_PATH=${BASE_PATH:-/digit-a11y}
      - API_KEY=${API_KEY:-}                      # empty = no auth (dev/demo)
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - LOG_LEVEL=info
      - SCAN_TIMEOUT_MS=${SCAN_TIMEOUT_MS:-120000}  # 2 minutes by default
    ports:
      - "3000:3000"
    volumes:
      - artifacts:/app/artifacts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000' + (process.env.BASE_PATH || '') + '/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  artifacts:
